<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <title>{% block title %}MyTaskManager{% endblock %}</title>
  </head>
  <body class="min-h-screen bg-gray-950 text-gray-100">
    <nav class="sticky top-0 z-10 border-b border-white/10 bg-gray-900/90 backdrop-blur">
      <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
        <a href="{{ url_for('index') }}" class="text-xl font-black tracking-tight">
          MyTask<span class="text-blue-400">Manager</span>
        </a>
        <div class="flex items-center gap-1">
          <a href="{{ url_for('index') }}"
             class="rounded-md px-3 py-2 text-sm font-medium {% if request.path == url_for('index') %}bg-white/10 text-white{% else %}text-gray-400 hover:bg-white/5 hover:text-white{% endif %}">
            Dashboard
          </a>
          <a href="{{ url_for('history') }}"
             class="rounded-md px-3 py-2 text-sm font-medium {% if request.path == url_for('history') %}bg-white/10 text-white{% else %}text-gray-400 hover:bg-white/5 hover:text-white{% endif %}">
            Riwayat
          </a>
          <a href="{{ url_for('wishlist') }}"
             class="rounded-md px-3 py-2 text-sm font-medium {% if request.path == url_for('wishlist') %}bg-white/10 text-white{% else %}text-gray-400 hover:bg-white/5 hover:text-white{% endif %}">
            Wishlist
          </a>
          <a href="{{ url_for('logout') }}"
             class="ml-2 rounded-md bg-white/5 px-3 py-2 text-sm font-medium text-gray-400 hover:bg-red-600/20 hover:text-red-300">
            Keluar
          </a>
        </div>
      </div>
    </nav>
    <main class="mx-auto max-w-5xl px-4 py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
