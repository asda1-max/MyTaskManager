<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <title>Login - MyTaskManager</title>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-gray-950 text-gray-100">
    <div class="w-full max-w-sm rounded-2xl bg-gray-800 p-8 shadow-lg">
      <h1 class="mb-2 text-center text-3xl font-black">MyTaskManager</h1>
      <p class="mb-6 text-center text-sm text-gray-400">Masukkan password untuk melanjutkan</p>
      <form method="post" class="grid gap-4">
        <input type="password" name="password" required placeholder="Password"
               class="w-full rounded-lg border border-white/10 bg-gray-900 px-4 py-3 text-sm outline-none placeholder-gray-500 focus:border-blue-500">
        <label class="flex items-center gap-2 text-sm text-gray-400">
          <input type="checkbox" name="remember" class="rounded border-white/10 bg-gray-900 accent-blue-500">
          Ingat device ini
        </label>
        <button class="w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-bold text-white transition hover:bg-blue-500">Masuk</button>
        {% if error %}
        <p class="text-center text-sm text-red-400">{{ error }}</p>
        {% endif %}
      </form>
    </div>
  </body>
</html>
